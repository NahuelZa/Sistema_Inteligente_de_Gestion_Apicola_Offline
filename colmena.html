<!DOCTYPE html>
<html lang="es" class="wa-theme-default wa-brand-orange">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeKeep</title>
</head>

<body>
    <wa-page>
        <header slot="header" class="app-header">
            <div class="header-brand">
                <h2>
                    <wa-icon name="cubes-stacked"></wa-icon>
                    BeeKeep: Registro de Colmena
                </h2>
            </div>
            <div class="header-actions">
                <wa-button id="reg-colmena" variant="brand" appearance="accent" href="/index.html">
                    <wa-icon slot="start" name="house" style="color: #f59e0b;"></wa-icon>
                    Volver a Inspecciones
                </wa-button>
            </div>
        </header>

        <main class="main-content">
            <wa-callout id="connectionStatus" variant="success" size="s">
                <wa-icon slot="icon" name="circle-check"></wa-icon>
                <span id="connectionStatusText">Conectado a Internet</span>
            </wa-callout>

            <wa-card class="card">
                <h3 slot="header">
                    <wa-icon name="clipboard-list"></wa-icon>
                    Nueva Colmena
                </h3>
                <form id="colmenaForm" class="inspection-form">
                    <wa-input id="colmenaId" name="colmenaId" label="Código/ID de Colmena:" placeholder="Ej: COL-01"
                        required with-clear>
                        <wa-icon slot="start" name="hashtag"></wa-icon>
                    </wa-input>

                    <wa-input id="apiarioId" name="apiarioId" label="Código/ID de Apiario:" placeholder="Ej: API-01"
                        required with-clear>
                        <wa-icon slot="start" name="hashtag"></wa-icon>
                    </wa-input>
                    <wa-select id="estado" name="estado" label="Estado de la Colmena:" value="habilitada"
                        style="width: max-content;" required>
                        <wa-option value="habilitada">Habilitada</wa-option>
                        <wa-option value="inhabilitada">Inhabilitada</wa-option>
                    </wa-select>
                    <wa-button id="submitBtn" type="submit" variant="brand" appearance="accent">
                        <wa-icon slot="start" name="floppy-disk"></wa-icon>
                        Guardar Colmena
                    </wa-button>
                </form>

            </wa-card>
            <div class="error-message" id="errorMessage" style="color: red; ">

            </div>
            <wa-card class="card">
                <h3 slot="header">
                    <wa-icon name="clock-rotate-left"></wa-icon>
                    Último registro guardado localmente:
                </h3>
                <pre id="localOutput">Esperando registros...</pre>
            </wa-card>
        </main>


    </wa-page>

    <script type="module" src="/src/colmena.ts"></script>
</body>

</html>
